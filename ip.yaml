name: cache
version: 0.1.0
spec: '0.1'
kind: ip
lang:
- bsv
identity:
  slug: cache-tapeout-bsv
  display_name: Direct mapped write through cache
  summary: 'A first level cache between a core and the fabric: direct mapped, write
    through, allocate on read.'
  category: memory
  subcategories:
  - cache
  ip_family: cache
  integration_profile: []
  maturity: planned
contract:
  version: 1
  ctrl:
    shape: flat
    aw: 8
    dw: 32
params:
  cachedBit:
    type: int
    default: 31
    range:
    - 0
    - 31
    desc: 地址的第几位为 1 才可缓存。外设不是内存，缓存了语义就错
  lines:
    type: int
    default: 8
    range:
    - 1
    - 256
    desc: 行数。直接映射，一行一个标签
  wpl:
    type: int
    default: 4
    range:
    - 1
    - 16
    desc: 每行几个字。缺失时整行拉回来，所以它也是填充的拍数
features:
  stats:
    type: bool
    default: true
    desc: 命中与缺失计数。量命中率要，流片可以关
    area:
      fixed: 1099.84
emit:
- kind: bsv
  package: Cache
  module: mkCache
  config_type: CacheCfg
  interface: CacheIfc
  pins:
  - name: up
    type: RegTarget
    targs:
    - 32
    - 32
  - name: down
    type: RegManager
    targs:
    - 32
    - 32
deps:
  hwcore: ^0.1
area:
  base:
    points:
      '1': 4013.8
      '4': 11890.48
      '8': 17312.68
      '32': 60538.8
    per: lines
  params:
    wpl:
      points:
        '1': -8840.44
        '2': -5945.52
        '4': 0.0
        '8': 11733.12
  margin: 0.1798
  model: points-additive
  error:
    bound: 0.1598
    sign: over
    note: the data array holds lines times words per line, so the two parameters multiply
      while the price list only adds; a delta measured at eight lines over-subtracts
      at six. The margin is therefore large and that is the shape of the model showing,
      not noise. The worst under estimate found is six lines of two words with statistics
      off, 16.0% under before the lift
  corner:
    tool: ecc
    pdk: ics55
    freq_mhz: 100
    measured: '2026-09-09'
    gen_digest: sha256:2ed3be61d76bb150
  measured:
  - at:
      cachedBit: 31
      lines: 1
      wpl: 4
      stats: false
    um2: 4013.8
  - at:
      cachedBit: 31
      lines: 4
      wpl: 4
      stats: false
    um2: 11890.48
  - at:
      cachedBit: 31
      lines: 8
      wpl: 4
      stats: false
    um2: 17312.68
  - at:
      cachedBit: 31
      lines: 32
      wpl: 4
      stats: false
    um2: 60538.8
  - at:
      cachedBit: 31
      lines: 8
      wpl: 1
      stats: true
    um2: 9572.08
  - at:
      cachedBit: 31
      lines: 8
      wpl: 2
      stats: true
    um2: 12467.0
  - at:
      cachedBit: 31
      lines: 8
      wpl: 4
      stats: true
    um2: 18412.52
  - at:
      cachedBit: 31
      lines: 8
      wpl: 8
      stats: true
    um2: 30145.64
test:
  noarea:
  - cachedBit
